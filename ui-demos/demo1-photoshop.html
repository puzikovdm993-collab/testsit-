<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Demo 1: Photoshop-style Palette</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; height: 100vh; background: #2b2b2b; color: #fff;
        }
        
        /* Left Toolbar */
        .toolbar-left {
            width: 60px;
            background: #3c3c3c;
            border-right: 1px solid #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }
        
        .tool-btn {
            width: 40px;
            height: 40px;
            margin: 5px 0;
            background: #555;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }
        
        .tool-btn:hover { background: #666; }
        .tool-btn.active { background: #0078d4; }
        
        /* Main Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }
        
        .menu-bar {
            height: 30px;
            background: #3c3c3c;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid #555;
        }
        
        .menu-item {
            padding: 5px 15px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .menu-item:hover { background: #555; }
        
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .image-canvas {
            width: 600px;
            height: 400px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* Right Panels */
        .panels-right {
            width: 280px;
            background: #3c3c3c;
            border-left: 1px solid #555;
            display: flex;
            flex-direction: column;
        }
        
        .panel {
            border-bottom: 1px solid #555;
            padding: 15px;
        }
        
        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .layer-item {
            background: #555;
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .layer-item:hover { background: #666; }
        .layer-item.active { background: #0078d4; }
        
        .slider-control {
            margin: 10px 0;
        }
        
        .slider-control label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }
        
        .slider-control input[type="range"] {
            width: 100%;
            height: 6px;
            background: #555;
            border-radius: 3px;
            outline: none;
        }
        
        .color-map-preview {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 3px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .color-swatch:hover { border-color: #fff; }
        .color-swatch.active { border-color: #0078d4; }
    </style>
</head>
<body>
    <!-- Left Toolbar -->
    <div class="toolbar-left">
        <button class="tool-btn active" title="Move">✥</button>
        <button class="tool-btn" title="Select">⬚</button>
        <button class="tool-btn" title="Lasso">∿</button>
        <button class="tool-btn" title="Crop">✂</button>
        <button class="tool-btn" title="Filter">🎨</button>
        <button class="tool-btn" title="Measure">📏</button>
        <button class="tool-btn" title="3D View">🧊</button>
    </div>
    
    <!-- Main Canvas -->
    <div class="canvas-area">
        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">Image</div>
            <div class="menu-item">Filters</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Help</div>
        </div>
        
        <div class="workspace">
            <div class="image-canvas"></div>
        </div>
    </div>
    
    <!-- Right Panels -->
    <div class="panels-right">
        <div class="panel">
            <div class="panel-title">Layers</div>
            <div class="layer-item active">Layer 1 - Processed</div>
            <div class="layer-item">Layer 2 - Original</div>
            <div class="layer-item">Layer 3 - Mask</div>
        </div>
        
        <div class="panel">
            <div class="panel-title">Adjustments</div>
            <div class="slider-control">
                <label>Brightness</label>
                <input type="range" min="0" max="200" value="100">
            </div>
            <div class="slider-control">
                <label>Contrast</label>
                <input type="range" min="0" max="200" value="100">
            </div>
            <div class="slider-control">
                <label>Gamma</label>
                <input type="range" min="0.1" max="3" step="0.1" value="1">
            </div>
        </div>
        
        <div class="panel">
            <div class="panel-title">Color Map</div>
            <div class="color-map-preview">
                <div class="color-swatch active" style="background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);"></div>
                <div class="color-swatch" style="background: linear-gradient(to right, #000, #888, #fff);"></div>
                <div class="color-swatch" style="background: linear-gradient(to right, #000044, #0000ff, #ffffff);"></div>
                <div class="color-swatch" style="background: linear-gradient(to right, #000000, #ff0000, #ffff00, #ffffff);"></div>
            </div>
        </div>
    </div>
</body>
</html>
