<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Penpot Fusion | Двойной интерфейс</title>
    <style>
        /* ---------- БАЗОВЫЕ ПЕРЕМЕННЫЕ ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ----- СТИЛЬ: МИНИМАЛИСТИЧНЫЙ (по умолчанию) ----- */
        body {
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #e5e5e5;
            --text: #171717;
            --text-secondary: #737373;
            --accent: #000000;
            --accent-soft: #f5f5f5;
            --danger: #dc2626;
            --radius: 0px;
            --shadow: none;
            --font: -apple-system, 'Inter', 'Segoe UI', monospace;
            --card-padding: 12px;
            --card-gap: 16px;
            --avatar-bg: transparent;
            --avatar-icon: '◉';
            --show-extra-meta: none;
            --show-avatar-icon: inline-block;
            --stat-display: none;
            --card-icon-display: none;
        }

        body.classic {
            --bg: #f0f2f8;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #475569;
            --accent: #6366f1;
            --accent-soft: #e0e7ff;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1);
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --card-padding: 18px;
            --card-gap: 20px;
            --show-extra-meta: flex;
            --show-avatar-icon: none;
            --stat-display: flex;
            --card-icon-display: block;
        }

        body.dark {
            --bg: #000000;
            --surface: #000000;
            --border: #262626;
            --text: #ededed;
            --text-secondary: #a3a3a3;
            --accent: #ffffff;
            --accent-soft: #1a1a1a;
        }
        body.classic.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent: #818cf8;
            --accent-soft: #2d3a5e;
        }

        body {
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.4;
            transition: background 0.2s, color 0.2s;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* ----- SIDEBAR ----- */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .user-profile {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .avatar-large {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: opacity 0.1s;
        }
        .avatar-large:hover {
            opacity: 0.8;
        }
        body.classic .avatar-large {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: var(--radius);
            justify-content: center;
            font-size: 1.4rem;
            color: white;
        }
        .avatar-large span {
            display: var(--show-avatar-icon);
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
        }
        body.classic .user-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .user-role {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        body.classic .user-role {
            background: var(--accent-soft);
            display: inline-block;
            padding: 2px 10px;
            border-radius: 30px;
        }

        .user-stats {
            display: var(--stat-display);
            gap: 12px;
            margin-top: 16px;
            background: var(--accent-soft);
            padding: 10px 12px;
            border-radius: var(--radius);
            font-size: 0.7rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .search-label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: var(--radius);
            background: var(--surface);
        }
        .search-box input {
            background: transparent;
            border: none;
            width: 100%;
            font-size: 0.8rem;
            outline: none;
            color: var(--text);
            font-family: var(--font);
        }
        .search-box span {
            color: var(--text-secondary);
            margin-right: 8px;
        }

        .projects-list-sidebar {
            flex: 1;
            padding: 12px 0;
        }
        .sidebar-title {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 8px 16px;
        }
        .project-side-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-left: 2px solid transparent;
            transition: 0.05s;
        }
        body.classic .project-side-item {
            margin: 2px 12px;
            border-radius: var(--radius-sm);
            border-left: none;
        }
        .project-side-item:hover {
            background: var(--accent-soft);
            color: var(--text);
        }
        .project-side-item.active-side {
            background: var(--accent-soft);
            border-left-color: var(--accent);
            color: var(--accent);
            font-weight: 500;
        }
        body.classic .project-side-item.active-side {
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
        }

        /* ----- MAIN ----- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .projects-header {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .back-to-projects-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 5px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--text-secondary);
            border-radius: var(--radius);
        }
        .back-to-projects-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .projects-header h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
        }
        body.classic .projects-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .result-count {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .btn-primary {
            background: var(--accent);
            border: none;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--bg);
            transition: 0.1s;
            border-radius: var(--radius);
        }
        .btn-primary:hover {
            opacity: 0.85;
        }

        /* карточки */
        .projects-grid-main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--card-gap);
        }

        .project-card-main {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: var(--card-padding);
            transition: 0.1s linear;
            cursor: default;
            position: relative;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .project-card-main.drag-over {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .project-card-main:hover {
            border-color: var(--accent);
        }
        .drag-handle {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 1rem;
            cursor: grab;
            color: var(--text-secondary);
            padding: 4px 6px;
            border-radius: var(--radius);
            user-select: none;
            z-index: 5;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .drag-handle:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .project-settings-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: var(--radius);
            z-index: 5;
        }
        .project-settings-btn:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .card-header-icon {
            display: var(--card-icon-display);
            font-size: 1.5rem;
            margin-bottom: 12px;
            margin-top: 8px;
        }
        .card-title {
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text);
            padding-right: 24px;
            padding-left: 20px;
        }
        body.classic .card-title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .card-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            font-family: monospace;
            margin-top: 6px;
        }
        .card-meta.extra-meta {
            display: var(--show-extra-meta);
        }
        .project-settings-menu {
            position: absolute;
            top: 32px;
            right: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 0;
            min-width: 150px;
            z-index: 100;
            display: none;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .project-settings-menu.show {
            display: block;
        }
        .project-settings-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            width: 100%;
            background: none;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-secondary);
            text-align: left;
        }
        .project-settings-menu-item:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .empty-projects {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            grid-column: 1 / -1;
            font-size: 0.8rem;
            border-radius: var(--radius);
        }

        /* модалки */
        .user-settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .user-settings-modal.show {
            display: flex;
        }
        .user-settings-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 24px;
            width: 90%;
            max-width: 440px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .settings-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        .close-settings-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .settings-form-group {
            margin-bottom: 18px;
        }
        .settings-form-group label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
        }
        .settings-form-group input, .settings-form-group select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.8rem;
            font-family: var(--font);
            border-radius: var(--radius);
        }
        .settings-form-group input:focus, .settings-form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .settings-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-secondary {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--text-secondary);
            border-radius: var(--radius);
        }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: var(--bg);
            padding: 6px 14px;
            font-size: 0.7rem;
            font-family: monospace;
            z-index: 1300;
            opacity: 0;
            transition: opacity 0.15s;
            pointer-events: none;
            border-radius: var(--radius);
        }
        .toast-msg.show {
            opacity: 1;
        }
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 40vh;
            }
            .main-content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="app-layout">
    <div class="sidebar">
        <div class="user-profile">
            <div class="avatar-large"><span>◉</span></div>
            <div class="user-name" id="displayUserName">Алина</div>
            <div class="user-role" id="displayUserRole">дизайнер</div>
            <div class="user-stats" id="userStatsPanel">
                <div class="stat-item"><span>📁</span> <span id="statProjects">0</span> проектов</div>
                <div class="stat-item"><span>⚡</span> <span id="statInProgress">0</span> активных</div>
            </div>
        </div>
        <div class="search-section">
            <div class="search-label">поиск</div>
            <div class="search-box">
                <span>⌕</span>
                <input type="text" id="sidebarSearchInput" placeholder="проект...">
            </div>
        </div>
        <div class="projects-list-sidebar">
            <div class="sidebar-title">проекты</div>
            <div id="sidebarProjectsList"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="projects-header" style="margin-bottom: 1rem;">
            <button id="openCreateProjectModalBtn" class="btn-primary">+ создать</button>
        </div>
        <div class="projects-header">
            <button id="backToProjectsBtn" class="back-to-projects-btn">← все</button>
            <h2>проекты</h2>
            <div class="result-count" id="projectsCountDisplay">0</div>
        </div>
        <div id="projectsGridMain" class="projects-grid-main">
            <div class="empty-projects">[ пусто ]</div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<!-- модалка настроек -->
<div id="userSettingsModal" class="user-settings-modal">
    <div class="user-settings-panel">
        <div class="settings-header">
            <h3>настройки</h3>
            <button id="closeSettingsBtn" class="close-settings-btn">✕</button>
        </div>
        <div class="settings-form-group">
            <label>имя</label>
            <input type="text" id="settingsUserName" value="Алина">
        </div>
        <div class="settings-form-group">
            <label>роль</label>
            <input type="text" id="settingsUserRole" value="дизайнер">
        </div>
        <div class="settings-form-group">
            <label>тема оформления</label>
            <select id="settingsTheme">
                <option value="dark">🌙 тёмная</option>
                <option value="light">☀️ светлая</option>
            </select>
        </div>
        <div class="settings-form-group">
            <label>стиль интерфейса</label>
            <select id="settingsUiStyle">
                <option value="minimal">минималистичный</option>
                <option value="classic">классический (светлая тема)</option>
            </select>
        </div>
        <div class="settings-actions">
            <button id="saveSettingsBtn" class="btn-primary">сохранить</button>
            <button id="cancelSettingsBtn" class="btn-secondary">отмена</button>
        </div>
    </div>
</div>

<!-- модалка создания проекта -->
<div id="createProjectModal" class="user-settings-modal">
    <div class="user-settings-panel">
        <div class="settings-header">
            <h3>новый проект</h3>
            <button id="closeCreateProjectModalBtn" class="close-settings-btn">✕</button>
        </div>
        <div class="settings-form-group">
            <label>название</label>
            <input type="text" id="newProjectName" placeholder="имя">
        </div>
        <div class="settings-form-group">
            <label>категория</label>
            <select id="projectCategory">
                <option>веб</option>
                <option>мобильное</option>
                <option>ui kit</option>
                <option>прототип</option>
            </select>
        </div>
        <div class="settings-form-group">
            <label>тип</label>
            <select id="projectType">
                <option value="classic">classic</option>
                <option value="tis">tis</option>
                <option value="workflow">workflow</option>
            </select>
        </div>
        <div class="settings-actions">
            <button id="createProjectModalBtn" class="btn-primary">создать</button>
            <button id="cancelCreateProjectModalBtn" class="btn-secondary">отмена</button>
        </div>
    </div>
</div>

<script>
    // ---------- ПОЛНАЯ ЛОГИКА С ПОДДЕРЖКОЙ ДВУХ СТИЛЕЙ И DRAG-AND-DROP ----------
    let projects = [];
    const API_BASE_URL = window.location.origin;
    let activeProjectId = null;
    let draggedProjectId = null;

    // DOM элементы
    const sidebarListEl = document.getElementById('sidebarProjectsList');
    const projectsGridMain = document.getElementById('projectsGridMain');
    const projectsCountDisplay = document.getElementById('projectsCountDisplay');
    const sidebarSearchInput = document.getElementById('sidebarSearchInput');
    const newProjectName = document.getElementById('newProjectName');
    const projectCategory = document.getElementById('projectCategory');
    const projectType = document.getElementById('projectType');
    const toastMsg = document.getElementById('toastMsg');
    const userSettingsModal = document.getElementById('userSettingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
    const backToProjectsBtn = document.getElementById('backToProjectsBtn');
    const settingsUserName = document.getElementById('settingsUserName');
    const settingsUserRole = document.getElementById('settingsUserRole');
    const settingsTheme = document.getElementById('settingsTheme');
    const settingsUiStyle = document.getElementById('settingsUiStyle');
    const createProjectModal = document.getElementById('createProjectModal');
    const openCreateProjectModalBtn = document.getElementById('openCreateProjectModalBtn');
    const closeCreateProjectModalBtn = document.getElementById('closeCreateProjectModalBtn');
    const createProjectModalBtn = document.getElementById('createProjectModalBtn');
    const cancelCreateProjectModalBtn = document.getElementById('cancelCreateProjectModalBtn');
    const displayUserNameSpan = document.getElementById('displayUserName');
    const displayUserRoleSpan = document.getElementById('displayUserRole');
    const statProjectsSpan = document.getElementById('statProjects');
    const statInProgressSpan = document.getElementById('statInProgress');
    const userStatsPanel = document.getElementById('userStatsPanel');
    const avatarLarge = document.querySelector('.avatar-large');

    function showToast(msg, isError = false) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 1800);
    }

    async function loadProjectsFromMinIO() {
        try {
            const res = await fetch(`${API_BASE_URL}/list_projects`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            if (data.success && Array.isArray(data.projects)) {
                projects = data.projects;
                // Присвоить order, если отсутствует
                let maxOrder = 0;
                for (let i = 0; i < projects.length; i++) {
                    if (projects[i].order === undefined || projects[i].order === null) {
                        projects[i].order = i;
                    }
                    if (projects[i].order > maxOrder) maxOrder = projects[i].order;
                }
                // Сортировка по order
                projects.sort((a,b) => (a.order || 0) - (b.order || 0));
                return true;
            }
            return false;
        } catch(e) { return false; }
    }
    async function saveProjectToMinIO(project) {
        try {
            const res = await fetch(`${API_BASE_URL}/save_project`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ project }) });
            const data = await res.json();
            return data.success;
        } catch(e) { return false; }
    }
    async function deleteProjectFromMinIO(projectId) {
        try {
            const res = await fetch(`${API_BASE_URL}/delete_project/${projectId}`, { method: 'DELETE' });
            const data = await res.json();
            return data.success;
        } catch(e) { return false; }
    }

    function getFilteredProjects() {
        const term = sidebarSearchInput.value.trim().toLowerCase();
        if (!term) return [...projects];
        return projects.filter(p => p.name.toLowerCase().includes(term));
    }

    function getIconByType(type) { return type === "classic" ? "◧" : (type === "tis" ? "◨" : "◩"); }
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); }); }

    function updateUserStatsUI() {
        statProjectsSpan.innerText = projects.length;
        const inProgress = projects.filter(p => p.deadline && p.deadline >= new Date().toISOString().slice(0,10)).length;
        statInProgressSpan.innerText = inProgress;
    }

    function renderSidebarList() {
        const filtered = getFilteredProjects();
        sidebarListEl.innerHTML = '';
        if (filtered.length === 0) {
            sidebarListEl.innerHTML = '<div style="padding: 8px 16px; color: var(--text-secondary);">—</div>';
            return;
        }
        filtered.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project-side-item';
            if (activeProjectId === p.id) div.classList.add('active-side');
            div.textContent = p.name;
            div.addEventListener('click', () => selectProject(p.id));
            sidebarListEl.appendChild(div);
        });
    }

    // ---------- DRAG & DROP ----------
    async function updateOrderOnServer(updatedProjects) {
        // Сохраняем каждый изменённый проект (те, у которых order отличается от предыдущего)
        // Для простоты сохраняем все проекты, у которых order был изменён. Но можно и все.
        // projects уже содержит новые order, сохраняем каждый проект.
        for (let p of updatedProjects) {
            await saveProjectToMinIO(p);
        }
    }

    function handleDragStart(e, projectId) {
        const searchActive = sidebarSearchInput.value.trim() !== '';
        if (searchActive) {
            e.preventDefault();
            showToast('✖ Снимите поиск для изменения порядка', true);
            return false;
        }
        draggedProjectId = projectId;
        e.dataTransfer.setData('text/plain', projectId);
        e.dataTransfer.effectAllowed = 'move';
        // Стиль при перетаскивании
        e.target.closest('.project-card-main')?.classList.add('dragging');
    }

    function handleDragEnd(e) {
        document.querySelectorAll('.project-card-main').forEach(card => {
            card.classList.remove('dragging', 'drag-over');
        });
        draggedProjectId = null;
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const card = e.target.closest('.project-card-main');
        if (card && draggedProjectId) {
            card.classList.add('drag-over');
        }
    }

    function handleDragLeave(e) {
        const card = e.target.closest('.project-card-main');
        if (card) card.classList.remove('drag-over');
    }

    async function handleDrop(e, targetProjectId) {
        e.preventDefault();
        const sourceId = draggedProjectId;
        if (!sourceId || sourceId === targetProjectId) return;
        
        const searchActive = sidebarSearchInput.value.trim() !== '';
        if (searchActive) {
            showToast('✖ Снимите поиск для изменения порядка', true);
            return;
        }

        // Найти индексы в основном массиве projects (не в отфильтрованном)
        const sourceIndex = projects.findIndex(p => p.id === sourceId);
        const targetIndex = projects.findIndex(p => p.id === targetProjectId);
        if (sourceIndex === -1 || targetIndex === -1) return;

        // Перемещение элемента
        const [movedProject] = projects.splice(sourceIndex, 1);
        projects.splice(targetIndex, 0, movedProject);

        // Обновить order для всех проектов в соответствии с новой позицией
        for (let i = 0; i < projects.length; i++) {
            projects[i].order = i;
        }

        // Сохранить изменения на сервере
        await updateOrderOnServer(projects);
        
        // Перерисовать интерфейс
        renderAll();
        showToast('Порядок сохранён');
    }

    // ---------- ОСТАЛЬНАЯ ЛОГИКА ----------
    function selectProject(projectId) {
        const p = projects.find(p => p.id === projectId);
        if(!p) return;
        activeProjectId = projectId;
        renderSidebarList(); renderMainGrid();
        showToast(p.name);
        setTimeout(() => {
            let url = 'penpot-fusion.html';
            if(p.type === 'tis') url = 'index.html';
            else if(p.type === 'workflow') url = 'workflow.html';
            window.location.href = url;
        }, 400);
    }

    async function createNewProject() {
        const name = newProjectName.value.trim();
        if(!name) { showToast("укажите название", true); return; }
        if(projects.some(p => p.name.toLowerCase() === name.toLowerCase())) { showToast("проект существует", true); return; }
        const newId = 'proj_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
        const maxOrder = projects.length > 0 ? Math.max(...projects.map(p => p.order || 0)) : -1;
        const newProj = {
            id: newId, name, category: projectCategory.value, type: projectType.value,
            deadline: "", createdAt: new Date().toISOString().slice(0,10),
            owner: displayUserNameSpan.innerText,
            order: maxOrder + 1
        };
        const saved = await saveProjectToMinIO(newProj);
        if(!saved) { showToast("ошибка", true); return; }
        projects.push(newProj);
        newProjectName.value = '';
        activeProjectId = newId;
        sidebarSearchInput.value = '';
        renderAll();
        showToast(`✓ ${name}`);
        createProjectModal.classList.remove('show');
    }

    async function duplicateProject(projectId) {
        const original = projects.find(p => p.id === projectId);
        if(!original) return;
        const newId = 'proj_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
        const maxOrder = Math.max(...projects.map(p => p.order || 0));
        const copy = { 
            ...original, 
            id: newId, 
            name: `${original.name} (копия)`, 
            createdAt: new Date().toISOString().slice(0,10),
            order: maxOrder + 1
        };
        const saved = await saveProjectToMinIO(copy);
        if(saved) { 
            projects.push(copy); 
            renderAll(); 
            showToast(`✓ дубль`);
        } else showToast("ошибка", true);
        closeAllMenus();
    }

    async function deleteProject(projectId) {
        const p = projects.find(p => p.id === projectId);
        if(!p || !confirm(`Удалить "${p.name}"?`)) return;
        const deleted = await deleteProjectFromMinIO(projectId);
        if(!deleted) { showToast("ошибка", true); return; }
        projects = projects.filter(pr => pr.id !== projectId);
        // Перенумеровать order
        for (let i = 0; i < projects.length; i++) {
            projects[i].order = i;
        }
        await updateOrderOnServer(projects);
        if(activeProjectId === projectId) activeProjectId = null;
        renderAll();
        showToast(`🗑 удалён`);
        closeAllMenus();
    }

    function openProjectSettings(projectId) {
        const p = projects.find(p => p.id === projectId);
        if(p) showToast(`⚙️ ${p.name}`);
        localStorage.setItem('activeProjectId', projectId);
        closeAllMenus();
    }

    function renderMainGrid() {
        const filtered = getFilteredProjects();
        projectsGridMain.innerHTML = '';
        if (filtered.length === 0) {
            projectsGridMain.innerHTML = '<div class="empty-projects">∅</div>';
            projectsCountDisplay.innerText = '0';
            return;
        }
        filtered.forEach(project => {
            const card = document.createElement('div');
            card.className = 'project-card-main';
            card.setAttribute('data-id', project.id);
            const typeLabel = project.type === 'classic' ? 'cls' : (project.type === 'tis' ? 'tis' : 'wf');
            const deadlineText = project.deadline ? `⏱ ${project.deadline}` : '—';
            const isClassic = document.body.classList.contains('classic');
            
            // Кнопка-ручка для перетаскивания
            const dragHandle = `<div class="drag-handle" draggable="true" data-id="${project.id}">⠿</div>`;
            
            card.innerHTML = `
                ${dragHandle}
                <button class="project-settings-btn" data-id="${project.id}">⋮</button>
                ${isClassic ? `<div class="card-header-icon">${getIconByType(project.type)}</div>` : ''}
                <div class="card-title">${escapeHtml(project.name)}</div>
                <div class="card-meta"><span>${project.category}</span><span>${typeLabel}</span></div>
                ${isClassic ? `<div class="card-meta extra-meta"><span>${deadlineText}</span><span>📅 ${project.createdAt || '—'}</span></div>
                <div class="card-meta extra-meta"><span>👤 ${escapeHtml(project.owner)}</span></div>` : ''}
                <div class="project-settings-menu" id="menu-${project.id}">
                    <button class="project-settings-menu-item" onclick="openProjectSettings('${project.id}')">настройки</button>
                    <button class="project-settings-menu-item" onclick="duplicateProject('${project.id}')">дублировать</button>
                    <button class="project-settings-menu-item" onclick="deleteProject('${project.id}')" style="color: var(--danger);">удалить</button>
                </div>
            `;
            
            // Обработчик клика по карточке (кроме кнопок)
            card.addEventListener('click', (e) => {
                if(!e.target.closest('.project-settings-btn') && !e.target.closest('.drag-handle') && !e.target.closest('.project-settings-menu')) 
                    selectProject(project.id);
            });
            
            // Кнопка меню (три точки)
            const btn = card.querySelector('.project-settings-btn');
            btn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(project.id); });
            
            // Drag-and-drop на карточке (для drop)
            card.addEventListener('dragover', handleDragOver);
            card.addEventListener('dragleave', handleDragLeave);
            card.addEventListener('drop', (e) => { handleDrop(e, project.id); });
            
            projectsGridMain.appendChild(card);
        });
        
        // Назначить обработчики для всех ручек после добавления в DOM
        document.querySelectorAll('.drag-handle').forEach(handle => {
            handle.setAttribute('draggable', 'true');
            handle.addEventListener('dragstart', (e) => {
                const projectId = handle.getAttribute('data-id');
                handleDragStart(e, projectId);
            });
            handle.addEventListener('dragend', handleDragEnd);
        });
        
        projectsCountDisplay.innerText = filtered.length;
    }

    function toggleMenu(id) { closeAllMenus(); const m = document.getElementById(`menu-${id}`); if(m) m.classList.toggle('show'); }
    function closeAllMenus() { document.querySelectorAll('.project-settings-menu').forEach(m => m.classList.remove('show')); }

    function renderAll() { renderSidebarList(); renderMainGrid(); updateUserStatsUI(); }

    // --- Управление стилями и темой ---
    function applyUiStyle(style) {
        if(style === 'classic') {
            document.body.classList.add('classic');
        } else {
            document.body.classList.remove('classic');
        }
        localStorage.setItem('ui_style', style);
        renderAll();
    }

    function applyTheme(theme) {
        if(theme === 'dark') document.body.classList.add('dark');
        else document.body.classList.remove('dark');
        localStorage.setItem('user_theme', theme);
    }

    function loadUserSettings() {
        const savedName = localStorage.getItem('user_name');
        const savedRole = localStorage.getItem('user_role');
        if(savedName) { displayUserNameSpan.innerText = savedName; settingsUserName.value = savedName; }
        if(savedRole) { displayUserRoleSpan.innerText = savedRole; settingsUserRole.value = savedRole; }
        const theme = localStorage.getItem('user_theme') || 'light';
        settingsTheme.value = theme;
        applyTheme(theme);
        const uiStyle = localStorage.getItem('ui_style') || 'minimal';
        settingsUiStyle.value = uiStyle;
        applyUiStyle(uiStyle);
    }

    function saveUserSettingsFromModal() {
        const newName = settingsUserName.value.trim();
        const newRole = settingsUserRole.value.trim();
        if(newName) { displayUserNameSpan.innerText = newName; localStorage.setItem('user_name', newName); }
        if(newRole) { displayUserRoleSpan.innerText = newRole; localStorage.setItem('user_role', newRole); }
        applyTheme(settingsTheme.value);
        applyUiStyle(settingsUiStyle.value);
        showToast("сохранено");
        userSettingsModal.classList.remove('show');
    }

    function initEvents() {
        openCreateProjectModalBtn.onclick = () => createProjectModal.classList.add('show');
        closeCreateProjectModalBtn.onclick = () => createProjectModal.classList.remove('show');
        cancelCreateProjectModalBtn.onclick = () => createProjectModal.classList.remove('show');
        createProjectModalBtn.onclick = createNewProject;
        sidebarSearchInput.addEventListener('input', () => renderAll());
        avatarLarge.addEventListener('click', () => userSettingsModal.classList.add('show'));
        closeSettingsBtn.onclick = () => userSettingsModal.classList.remove('show');
        cancelSettingsBtn.onclick = () => userSettingsModal.classList.remove('show');
        saveSettingsBtn.onclick = saveUserSettingsFromModal;
        backToProjectsBtn.onclick = () => document.querySelector('.main-content').scrollTo({top:0, behavior:'smooth'});
        document.addEventListener('click', (e) => { if(!e.target.closest('.project-settings-btn') && !e.target.closest('.project-settings-menu')) closeAllMenus(); });
        createProjectModal.addEventListener('click', (e) => { if(e.target === createProjectModal) createProjectModal.classList.remove('show'); });
        userSettingsModal.addEventListener('click', (e) => { if(e.target === userSettingsModal) userSettingsModal.classList.remove('show'); });
    }

    async function init() {
        await loadProjectsFromMinIO();
        loadUserSettings();
        if(projects.length > 0 && !activeProjectId) activeProjectId = projects[0].id;
        renderAll();
        initEvents();
    }
    init();

    window.openProjectSettings = openProjectSettings;
    window.duplicateProject = duplicateProject;
    window.deleteProject = deleteProject;
</script>
</body>
</html>
