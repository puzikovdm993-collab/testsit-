<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penpot Projects Manager (Improved Architecture)</title>
    <meta name="description" content="Улучшенный менеджер проектов Penpot с соблюдением лучших практик разработки">
    
    <!-- Content Security Policy для безопасности -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">

    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --color-bg: #f4f5f7;
            --color-surface: #ffffff;
            --color-text: #1f2937;
            --color-text-secondary: #6b7280;
            --color-primary: #5e6ad2;
            --color-primary-hover: #4e5ab8;
            --color-danger: #ef4444;
            --color-danger-hover: #dc2626;
            --color-border: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 8px;
            --transition: 0.2s ease;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="dark"] {
            --color-bg: #111827;
            --color-surface: #1f2937;
            --color-text: #f9fafb;
            --color-text-secondary: #9ca3af;
            --color-border: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            transition: background-color var(--transition), color var(--transition);
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* --- Layout --- */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        h1 { font-size: 1.5rem; font-weight: 700; }

        /* --- Controls & Filters --- */
        .controls-bar {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
            background: var(--color-surface);
            padding: 1rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .search-group {
            position: relative;
            flex-grow: 1;
            min-width: 200px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-bg);
            color: var(--color-text);
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: 2px solid var(--color-primary);
            border-color: transparent;
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-weight: 500;
            transition: all var(--transition);
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }
        .btn-primary:hover { background-color: var(--color-primary-hover); }
        .btn-primary:focus-visible { outline: 2px solid var(--color-primary); offset: 2px; }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text);
        }
        .btn-secondary:hover { background-color: var(--color-bg); }

        .btn-icon {
            padding: 0.5rem;
            border-radius: 50%;
            color: var(--color-text-secondary);
        }
        .btn-icon:hover { background-color: var(--color-bg); color: var(--color-text); }
        .btn-icon.active { color: var(--color-primary); background-color: rgba(94, 106, 210, 0.1); }

        .btn-danger {
            background-color: var(--color-danger);
            color: white;
        }
        .btn-danger:hover { background-color: var(--color-danger-hover); }

        /* --- Grid & Cards --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: transform var(--transition), box-shadow var(--transition);
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .project-card.dragging {
            opacity: 0.5;
            border: 2px dashed var(--color-primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            word-break: break-word;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            opacity: 0; 
            transition: opacity var(--transition);
        }

        .project-card:hover .card-actions,
        .project-card:focus-within .card-actions {
            opacity: 1;
        }

        /* Drag Handle */
        .drag-handle {
            cursor: grab;
            color: var(--color-text-secondary);
            padding: 0.25rem;
            border-radius: 4px;
        }
        .drag-handle:active { cursor: grabbing; }

        /* --- Empty State --- */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--color-text-secondary);
            grid-column: 1 / -1;
        }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition), visibility var(--transition);
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--color-surface);
            padding: 2rem;
            border-radius: var(--radius);
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-md);
            transform: scale(0.95);
            transition: transform var(--transition);
        }

        .modal-overlay.open .modal { transform: scale(1); }

        .modal-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; }
        .modal-body { margin-bottom: 1.5rem; color: var(--color-text-secondary); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; }

        /* --- Toast Notifications --- */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1100;
        }

        .toast {
            background: var(--color-surface);
            color: var(--color-text);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 250px;
            border-left: 4px solid var(--color-primary);
            animation: slideIn 0.3s ease forwards;
        }

        .toast.error { border-left-color: var(--color-danger); }
        .toast.success { border-left-color: #10b981; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }

        /* Utility */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); border: 0;
        }
    </style>
</head>
<body>

<div id="app" class="app-container">
    <header>
        <div style="display:flex; align-items:center; gap:1rem;">
            <button id="backBtn" class="btn btn-secondary" aria-label="Назад к списку всех проектов">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Все проекты</span>
            </button>
            <h1>Мои Проекты</h1>
        </div>
        <div style="display:flex; gap:0.5rem;">
            <button id="themeToggle" class="btn btn-icon" aria-label="Переключить тему">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <button id="exportBtn" class="btn btn-secondary">Экспорт</button>
            <label for="importFile" class="btn btn-secondary">Импорт</label>
            <input type="file" id="importFile" accept=".json" class="sr-only">
        </div>
    </header>

    <section class="controls-bar" aria-label="Фильтры и поиск">
        <div class="search-group">
            <label for="searchInput" class="sr-only">Поиск проектов</label>
            <input type="text" id="searchInput" placeholder="Поиск по названию..." autocomplete="off">
        </div>
        
        <select id="sortSelect" aria-label="Сортировка">
            <option value="name-asc">По имени (А-Я)</option>
            <option value="name-desc">По имени (Я-А)</option>
            <option value="date-desc">Сначала новые</option>
            <option value="date-asc">Сначала старые</option>
        </select>

        <div style="display:flex; gap:0.25rem; border-left:1px solid var(--color-border); padding-left:0.75rem;">
            <button class="btn btn-icon" data-density="comfortable" aria-label="Комфортный вид" title="Комфортный">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            </button>
            <button class="btn btn-icon" data-density="compact" aria-label="Компактный вид" title="Компактный">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M3 21h18"/></svg>
            </button>
        </div>
    </section>

    <main id="projectsGrid" class="projects-grid" role="list" aria-live="polite">
        <!-- Карточки рендерятся здесь через JS -->
    </main>
</div>

<!-- Модальное окно подтверждения -->
<dialog id="confirmModal" class="modal-overlay" aria-modal="true" role="alertdialog">
    <div class="modal">
        <h2 class="modal-title" id="modalTitle">Подтверждение действия</h2>
        <p class="modal-body" id="modalMessage">Вы уверены?</p>
        <div class="modal-footer">
            <button id="modalCancel" class="btn btn-secondary">Отмена</button>
            <button id="modalConfirm" class="btn btn-danger">Подтвердить</button>
        </div>
    </div>
</dialog>

<!-- Контейнер уведомлений -->
<div id="toastContainer" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

<script type="module">
/**
 * MODULE: Utils
 * Безопасные утилиты и помощники
 */
const Utils = {
    /**
     * Санитизация строки для предотвращения XSS при отображении
     * Используем textContent вместо innerHTML там, где это возможно.
     * Эта функция нужна только если мы вынуждены вставлять текст в атрибуты или сложную разметку.
     */
    escapeHtml: (str) => {
        if (typeof str !== 'string') return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    },

    /**
     * Генерация уникального ID
     */
    generateId: () => '_' + Math.random().toString(36).substr(2, 9),

    /**
     * Форматирование даты
     */
    formatDate: (isoString) => {
        return new Date(isoString).toLocaleDateString('ru-RU', {
            day: 'numeric', month: 'short', year: 'numeric'
        });
    }
};

/**
 * MODULE: Store
 * Управление состоянием приложения (Single Source of Truth)
 * Состояние никогда не хранится в DOM.
 */
const Store = {
    state: {
        projects: [],
        filters: {
            search: '',
            sort: 'name-asc',
            density: 'comfortable' // 'comfortable' | 'compact'
        },
        theme: localStorage.getItem('penpot_theme') || 'light'
    },

    listeners: new Set(),

    init() {
        const saved = localStorage.getItem('penpot_projects');
        if (saved) {
            try {
                this.state.projects = JSON.parse(saved);
            } catch (e) {
                console.error('Failed to parse projects', e);
                this.state.projects = [];
            }
        } else {
            // Демо данные для первого запуска
            this.state.projects = [
                { id: '1', name: 'Дизайн системы', updatedAt: new Date().toISOString(), favorite: true },
                { id: '2', name: 'Лендинг продукта', updatedAt: new Date(Date.now() - 86400000).toISOString(), favorite: false },
                { id: '3', name: 'Мобильное приложение', updatedAt: new Date(Date.now() - 172800000).toISOString(), favorite: false },
            ];
        }
        this.applyTheme();
    },

    subscribe(callback) {
        this.listeners.add(callback);
        return () => this.listeners.delete(callback); // Unsubscribe function
    },

    notify() {
        this.listeners.forEach(cb => cb({ ...this.state }));
        this.save();
    },

    save() {
        localStorage.setItem('penpot_projects', JSON.stringify(this.state.projects));
        localStorage.setItem('penpot_theme', this.state.theme);
    },

    setProjects(projects) {
        this.state.projects = projects;
        this.notify();
    },

    toggleFavorite(id) {
        const project = this.state.projects.find(p => p.id === id);
        if (project) {
            project.favorite = !project.favorite;
            this.notify();
        }
    },

    deleteProject(id) {
        this.state.projects = this.state.projects.filter(p => p.id !== id);
        this.notify();
    },

    updateFilter(key, value) {
        this.state.filters[key] = value;
        this.notify();
    },

    toggleTheme() {
        this.state.theme = this.state.theme === 'light' ? 'dark' : 'light';
        this.applyTheme();
        this.notify();
    },

    applyTheme() {
        document.documentElement.setAttribute('data-theme', this.state.theme);
    },

    getFilteredProjects() {
        let result = [...this.state.projects];

        // Search
        if (this.state.filters.search) {
            const q = this.state.filters.search.toLowerCase();
            result = result.filter(p => p.name.toLowerCase().includes(q));
        }

        // Sort
        const { sort } = this.state.filters;
        result.sort((a, b) => {
            const dateA = new Date(a.updatedAt);
            const dateB = new Date(b.updatedAt);
            
            if (sort === 'name-asc') return a.name.localeCompare(b.name);
            if (sort === 'name-desc') return b.name.localeCompare(a.name);
            if (sort === 'date-desc') return dateB - dateA;
            if (sort === 'date-asc') return dateA - dateB;
            return 0;
        });

        // Favorites first (optional logic, currently just sorting by date/name)
        // Можно добавить логику: if (a.favorite === b.favorite) ... else return b.favorite - a.favorite;

        return result;
    }
};

/**
 * MODULE: UI Components
 * Рендеринг компонентов без прямого манипулирования состоянием
 */
const Components = {
    createCard(project) {
        const article = document.createElement('article');
        article.className = 'project-card';
        article.setAttribute('role', 'listitem');
        article.dataset.id = project.id;
        article.draggable = true; // Включаем drag-n-drop

        // Accessibility: Label для скринридеров
        const favLabel = project.favorite ? 'Удалить из избранного' : 'Добавить в избранное';

        article.innerHTML = `
            <div class="card-header">
                <div class="drag-handle" title="Перетащить для сортировки" aria-label="Перетащить">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                </div>
                <button class="btn btn-icon fav-btn" aria-label="${favLabel}" aria-pressed="${project.favorite}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="${project.favorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </button>
            </div>
            <h3 class="card-title">${Utils.escapeHtml(project.name)}</h3>
            <div class="card-meta">
                <span>Обновлено: ${Utils.formatDate(project.updatedAt)}</span>
            </div>
            <div class="card-actions">
                <button class="btn btn-secondary btn-sm edit-btn">Ред.</button>
                <button class="btn btn-danger btn-sm delete-btn">Удалить</button>
            </div>
        `;

        return article;
    },

    renderEmptyState() {
        const div = document.createElement('div');
        div.className = 'empty-state';
        div.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <h3>Проектов не найдено</h3>
            <p>Попробуйте изменить параметры поиска или создайте новый проект.</p>
        `;
        return div;
    }
};

/**
 * MODULE: App Controller
 * Основная логика приложения, связывание событий и рендеринг
 */
const App = {
    container: null,
    grid: null,
    
    // Ссылки на элементы модального окна
    modal: null,
    modalTitle: null,
    modalMessage: null,
    modalConfirm: null,
    modalCancel: null,
    
    // Текущий контекст для модального окна (например, ID удаляемого проекта)
    modalContext: null,

    init() {
        // Инициализация хранилища
        Store.init();

        // Кэширование DOM элементов
        this.container = document.getElementById('app');
        this.grid = document.getElementById('projectsGrid');
        this.modal = document.getElementById('confirmModal');
        this.modalTitle = document.getElementById('modalTitle');
        this.modalMessage = document.getElementById('modalMessage');
        this.modalConfirm = document.getElementById('modalConfirm');
        this.modalCancel = document.getElementById('modalCancel');

        // Подписка на изменения состояния
        this.unsubscribeStore = Store.subscribe(this.render.bind(this));

        // Привязка глобальных событий
        this.bindGlobalEvents();

        // Первичный рендер
        this.render();
    },

    bindGlobalEvents() {
        // Делегирование событий для сетки проектов (Performance)
        this.grid.addEventListener('click', this.handleGridClick.bind(this));
        this.grid.addEventListener('dragstart', this.handleDragStart.bind(this));
        this.grid.addEventListener('dragover', this.handleDragOver.bind(this));
        this.grid.addEventListener('drop', this.handleDrop.bind(this));
        this.grid.addEventListener('dragend', this.handleDragEnd.bind(this));

        // Поиск и фильтры
        document.getElementById('searchInput').addEventListener('input', (e) => {
            Store.updateFilter('search', e.target.value);
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            Store.updateFilter('sort', e.target.value);
        });

        // Плотность сетки
        document.querySelectorAll('[data-density]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const density = e.currentTarget.dataset.density;
                Store.updateFilter('density', density);
                
                // Визуальное обновление кнопок
                document.querySelectorAll('[data-density]').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                
                // Применение класса к гриду
                this.grid.style.gap = density === 'compact' ? '0.75rem' : '1.5rem';
                const cards = this.grid.querySelectorAll('.project-card');
                cards.forEach(card => {
                    card.style.padding = density === 'compact' ? '0.75rem' : '1rem';
                });
            });
        });

        // Тема
        document.getElementById('themeToggle').addEventListener('click', () => Store.toggleTheme());

        // Экспорт
        document.getElementById('exportBtn').addEventListener('click', this.handleExport.bind(this));

        // Импорт
        document.getElementById('importFile').addEventListener('change', this.handleImport.bind(this));

        // Модальное окно
        this.modalCancel.addEventListener('click', () => this.closeModal());
        this.modalConfirm.addEventListener('click', () => this.executeModalAction());
        
        // Закрытие по клику вне модалки
        this.modal.addEventListener('click', (e) => {
            if (e.target === this.modal) this.closeModal();
        });

        // Закрытие по Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && this.modal.classList.contains('open')) {
                this.closeModal();
            }
        });

        // Кнопка назад (заглушка)
        document.getElementById('backBtn').addEventListener('click', () => {
            Toast.show('Навигация назад пока не реализована', 'info');
        });
    },

    handleGridClick(e) {
        const target = e.target.closest('button');
        if (!target) return;

        const card = target.closest('.project-card');
        if (!card) return;

        const id = card.dataset.id;

        if (target.classList.contains('fav-btn')) {
            Store.toggleFavorite(id);
        } else if (target.classList.contains('delete-btn')) {
            this.openDeleteConfirm(id);
        } else if (target.classList.contains('edit-btn')) {
            Toast.show('Редактирование названия пока недоступно', 'info');
        }
    },

    // --- Drag and Drop Logic ---
    draggedItem: null,

    handleDragStart(e) {
        const card = e.target.closest('.project-card');
        if (!card) return;
        
        this.draggedItem = card;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        // Для доступности: сообщаем скринридеру
        e.dataTransfer.setData('text/plain', card.dataset.id);
    },

    handleDragOver(e) {
        e.preventDefault(); // Необходимо для разрешения drop
        const card = e.target.closest('.project-card');
        if (!card || card === this.draggedItem) return;

        const bounding = card.getBoundingClientRect();
        const offset = bounding.y + (bounding.height / 2);
        
        if (e.clientY - offset > 0) {
            card.after(this.draggedItem);
        } else {
            card.before(this.draggedItem);
        }
    },

    handleDrop(e) {
        e.stopPropagation();
        if (!this.draggedItem) return;

        // Получаем новый порядок из DOM
        const newOrderIds = Array.from(this.grid.querySelectorAll('.project-card'))
            .map(card => card.dataset.id);

        // Синхронизируем состояние
        const newProjects = [];
        newOrderIds.forEach(id => {
            const proj = Store.state.projects.find(p => p.id === id);
            if (proj) newProjects.push(proj);
        });

        Store.setProjects(newProjects);
        Toast.show('Порядок проектов сохранен', 'success');
    },

    handleDragEnd() {
        if (this.draggedItem) {
            this.draggedItem.classList.remove('dragging');
            this.draggedItem = null;
        }
    },

    // --- Modal Logic ---
    openDeleteConfirm(id) {
        this.modalContext = { action: 'delete', id };
        this.modalTitle.textContent = 'Удаление проекта';
        this.modalMessage.textContent = 'Вы уверены, что хотите удалить этот проект? Это действие нельзя отменить.';
        this.modalConfirm.textContent = 'Удалить';
        this.modalConfirm.classList.add('btn-danger');
        
        this.openModal();
    },

    openModal() {
        this.modal.classList.add('open');
        this.modal.showModal(); // Нативный метод dialog
        // Фокус на кнопку подтверждения для доступности
        setTimeout(() => this.modalConfirm.focus(), 50);
    },

    closeModal() {
        this.modal.classList.remove('open');
        this.modal.close();
        this.modalContext = null;
        // Возврат фокуса (упрощенно)
        document.body.focus();
    },

    executeModalAction() {
        if (!this.modalContext) return;

        if (this.modalContext.action === 'delete') {
            Store.deleteProject(this.modalContext.id);
            Toast.show('Проект успешно удален', 'success');
        }

        this.closeModal();
    },

    // --- Import/Export ---
    handleExport() {
        const dataStr = JSON.stringify(Store.state.projects, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `penpot-projects-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        Toast.show('Проекты экспортированы', 'success');
    },

    handleImport(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const imported = JSON.parse(event.target.result);
                if (!Array.isArray(imported)) throw new Error('Неверный формат');
                
                // Простая валидация структуры
                if (imported.length > 0 && !imported[0].hasOwnProperty('id')) {
                    throw new Error('Отсутствуют обязательные поля');
                }

                if(confirm('Это заменит текущий список проектов. Продолжить?')) {
                    Store.setProjects(imported);
                    Toast.show('Проекты импортированы', 'success');
                }
            } catch (err) {
                Toast.show('Ошибка импорта: неверный файл', 'error');
                console.error(err);
            } finally {
                e.target.value = ''; // Сброс инпута
            }
        };
        reader.readAsText(file);
    },

    // --- Render ---
    render() {
        const projects = Store.getFilteredProjects();
        
        // Очистка сетки (эффективный способ через DocumentFragment можно добавить для больших списков)
        this.grid.innerHTML = '';

        if (projects.length === 0) {
            this.grid.appendChild(Components.renderEmptyState());
            return;
        }

        const fragment = document.createDocumentFragment();
        projects.forEach(project => {
            fragment.appendChild(Components.createCard(project));
        });

        this.grid.appendChild(fragment);

        // Обновление визуального состояния кнопок плотности
        const currentDensity = Store.state.filters.density;
        document.querySelectorAll('[data-density]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.density === currentDensity);
        });
    }
};

/**
 * MODULE: Toast Notifications
 * Система уведомлений
 */
const Toast = {
    container: document.getElementById('toastContainer'),
    
    show(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.setAttribute('role', 'alert');
        
        // Иконка в зависимости от типа
        let icon = '';
        if (type === 'success') icon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
        if (type === 'error') icon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        if (type === 'info') icon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5e6ad2" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

        toast.innerHTML = `${icon}<span>${Utils.escapeHtml(message)}</span>`;
        
        this.container.appendChild(toast);

        // Автоудаление
        const timeoutId = setTimeout(() => {
            toast.style.animation = 'fadeOut 0.3s ease forwards';
            toast.addEventListener('animationend', () => toast.remove());
        }, 3000);

        // Удаление по клику
        toast.addEventListener('click', () => {
            clearTimeout(timeoutId);
            toast.remove();
        });
    }
};

// Запуск приложения
document.addEventListener('DOMContentLoaded', () => {
    App.init();
});

</script>
